repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: detect-private-key

  # Secret scanning on the staged diff; CI is the non-bypassable backstop.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Local hooks run the exact Prettier / ESLint / vitest versions in
  # node_modules, invoked through node so they work on Windows and Linux
  # without the .bin shims.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node node_modules/prettier/bin/prettier.cjs --check --end-of-line=auto
        language: system
        files: \.(js|jsx|mjs|cjs|json|css|md|yml|yaml)$
        exclude: ^(package-lock\.json|dist/|out/)

      - id: eslint
        name: eslint
        entry: node node_modules/eslint/bin/eslint.js
        language: system
        files: \.(js|jsx|mjs|cjs)$
        exclude: ^(dist/|out/)

      - id: vitest
        name: vitest
        entry: node node_modules/vitest/vitest.mjs run --silent
        language: system
        pass_filenames: false
        files: ^(src|test)/.*\.(js|jsx)$
